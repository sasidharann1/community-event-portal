<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div id="card">
    Event Card
</div>
<br>
<button id="registerBtn">
    Register
</button>
<script>
$("#registerBtn").click(function() {
    $("#card").fadeOut(1000);
    $("#card").fadeIn(1000);
});
</script>
</body>
</html>
